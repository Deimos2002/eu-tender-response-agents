[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eu-tender-response-agents"
version = "0.1.0"
description = "Multi-agent tender response writer with MCP tools, grounding checks and an injection test suite"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "langgraph>=1.2",
    "langchain-core>=1.6",
    "mcp>=1.30",
    "langchain-mcp-adapters>=0.3",
    "pydantic>=2.13",
    "httpx>=0.28",
    "fastapi>=0.141",
    "uvicorn>=0.54",
    "duckdb>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.14"]
langfuse = ["langfuse>=3,<4"]

[tool.setuptools.packages.find]
include = ["tw*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "I", "B", "UP"]
ignore = ["E501"]
